<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Guides</title>
    <style>
        /* Basic Styling for Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url(https://www.touristsecrets.com/wp-content/uploads/2023/09/is-the-life-of-a-traveler-bound-to-be-a-lonely-one-1695376880.jpg);
            background-size: cover;
        }

        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }

        /* Table Styling */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: #fff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Search Bar Styling */
        .search-bar {
            margin: 20px;
            text-align: center;
        }

        .search-bar input {
            padding: 10px;
            width: 200px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        .search-bar button {
            padding: 10px;
            border: none;
            border-radius: 5px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }

        .search-bar button:hover {
            opacity: 0.8;
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .update-btn {
            background-color: #28a745;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .update-btn:hover, .delete-btn:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <h1>Guides</h1>
    
    <!-- Search Form -->
    <div class="search-bar">
        <form method="GET" action="{{ url_for('view_guides') }}">
            <input type="text" id="search" name="search" placeholder="Search by Name, Language, or Destination" value="{{ request.args.get('search', '') }}">
            <button type="submit">Search</button>
        </form>
    </div>

    <!-- Table of Guides -->
    <table>
        <thead>
            <tr>
                <th>Guide ID</th>
                <th>Name</th>
                <th>Experience</th>
                <th>Language</th>
                <th>Destination</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for guide in guides %}
            <tr>
                <td>{{ guide[0] }}</td>
                <td>{{ guide[1] }}</td>
                <td>{{ guide[2] }}</td>
                <td>{{ guide[3] }}</td>
                <td>{{ guide[4] }}</td>
                <td>
                    <a href="{{ url_for('update_guide', guide_id=guide[0]) }}">
                        <button class="action-btn update-btn">Update</button>
                    </a>
                    <a href="{{ url_for('delete_guide', guide_id=guide[0]) }}" onclick="return confirm('Are you sure you want to delete this Guide?')">
                        <button class="action-btn delete-btn">Delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
