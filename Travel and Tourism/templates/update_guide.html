<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Guide</title>
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #F0F4F8, #E3EAF0); /* Soft gradient */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
            background-image: url(https://www.touristsecrets.com/wp-content/uploads/2023/09/is-the-life-of-a-traveler-bound-to-be-a-lonely-one-1695376880.jpg);
            background-size: cover;
        }

        /* Container for the form */
        .form-container {
            background-color: #ffffff; /* Clean white background */
            padding: 40px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Form Title */
        h1 {
            font-size: 28px;
            color: #1C3D5A; /* Dark blue for professionalism */
            margin-bottom: 20px;
        }

        /* Labels for form fields */
        label {
            display: block;
            font-size: 14px;
            color: #4B4F54;
            margin-bottom: 5px;
            text-align: left;
        }

        /* Input Fields */
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #f8f8f8;
            transition: border-color 0.3s ease;
        }

        /* Focused input fields */
        input[type="text"]:focus, input[type="number"]:focus{
            border-color: #3E7DFF; /* Light blue for focus */
            outline: none;
            box-shadow: 0 0 8px rgba(62, 125, 255, 0.2);
        }

        /* Submit button */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #3E7DFF; /* Professional blue */
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #2563EB; /* Darker blue on hover */
            transform: scale(1.05);
        }

        /* Link style */
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3E7DFF;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #2563EB; /* Darker blue on hover */
        }

        /* Error message */
        .error-message {
            color: #FF4F5A; /* Red for errors */
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .form-container {
                width: 100%;
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            input[type="text"], input[type="number"], button[type="submit"] {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h1>Update User</h1>
        <form method="POST" id="addUserForm">
            <div class="error-message" id="errorMessage"></div>

        <label for="name">Name:</label>
        <input type="text" name="name" value="{{ guide[1] }}" required><br>

        <label for="experience">Experience:</label>
        <input type="text" name="experience" value="{{ guide[2] }}" required><br>

        <label for="language">Language:</label>
        <input type="text" name="language" value="{{ guide[3] }}" required><br>

        <button type="submit">Update Guide</button>
    </form>

    <a href="{{ url_for('view_guides') }}">Back to Guides</a>
    </div>
</body>
</html>
