<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add User</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* General Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Body Styling */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #F0F4F8, #E3EAF0); /* Soft gradient */
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            padding: 20px;
            overflow: hidden;
            background-image: url(https://www.touristsecrets.com/wp-content/uploads/2023/09/is-the-life-of-a-traveler-bound-to-be-a-lonely-one-1695376880.jpg);
            background-size: cover;
        }

        /* Container for the form */
        .form-container {
            background-color: #ffffff; /* Clean white background */
            padding: 40px;
            width: 400px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        /* Form Title */
        h1 {
            font-size: 28px;
            color: #1C3D5A; /* Dark blue for professionalism */
            margin-bottom: 20px;
        }

        /* Labels for form fields */
        label {
            display: block;
            font-size: 14px;
            color: #4B4F54;
            margin-bottom: 5px;
            text-align: left;
        }

        /* Input Fields */
        input[type="text"], input[type="email"], input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            color: #333;
            background-color: #f8f8f8;
            transition: border-color 0.3s ease;
        }

        /* Focused input fields */
        input[type="text"]:focus, input[type="email"]:focus, input[type="password"]:focus {
            border-color: #3E7DFF; /* Light blue for focus */
            outline: none;
            box-shadow: 0 0 8px rgba(62, 125, 255, 0.2);
        }

        /* Submit button */
        button[type="submit"] {
            width: 100%;
            padding: 12px;
            background-color: #3E7DFF; /* Professional blue */
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.2s ease;
        }

        button[type="submit"]:hover {
            background-color: #2563EB; /* Darker blue on hover */
            transform: scale(1.05);
        }

        /* Link style */
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #3E7DFF;
            font-size: 14px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #2563EB; /* Darker blue on hover */
        }

        /* Error message */
        .error-message {
            color: #FF4F5A; /* Red for errors */
            font-size: 14px;
            margin-bottom: 20px;
            text-align: center;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            .form-container {
                width: 100%;
                padding: 20px;
            }

            h1 {
                font-size: 24px;
            }

            input[type="text"], input[type="email"], input[type="password"], button[type="submit"] {
                font-size: 14px;
                padding: 10px;
            }
        }
    </style>
</head>
<body>

    <!-- Form Container -->
    <div class="form-container">
        <h1>Add User</h1>
        <form method="POST" id="addUserForm">
            <div class="error-message" id="errorMessage"></div>

            <label for="userid">UserID:</label>
            <input type="text" id="userid" name="userid" required>

            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email">

            <label for="phonenumber">Phone Number:</label>
            <input type="text" id="phonenumber" name="phonenumber">

            <button type="submit">Add User</button>
        </form>

        <a href="{{ url_for('index') }}">Back to Home</a>
    </div>

    <script>
        // JavaScript Form Validation
        document.getElementById("addUserForm").addEventListener("submit", function(event) {
            event.preventDefault();  // Prevent form submission

            let errorMessage = "";
            let userID = document.getElementById("userid").value;
            let username = document.getElementById("username").value;
            let password = document.getElementById("password").value;
            let email = document.getElementById("email").value;
            let phone = document.getElementById("phonenumber").value;

            // UserID validation (check if it's a number)
            if (isNaN(userID)) {
                errorMessage += "UserID should be a number.<br>";
            }

            // Username validation (should not be empty)
            if (username.trim() === "") {
                errorMessage += "Username cannot be empty.<br>";
            }

            // Password validation (minimum 6 characters)
            if (password.length < 6) {
                errorMessage += "Password must be at least 6 characters.<br>";
            }

            // Phone number validation (must be exactly 10 digits)
            if (phone && (!/^\d{10}$/.test(phone))) {
                errorMessage += "Phone number must be exactly 10 digits.<br>";
            }

            // Display error messages if any
            if (errorMessage) {
                document.getElementById("errorMessage").innerHTML = errorMessage;
            } else {
                document.getElementById("errorMessage").innerHTML = "";
                // If validation is successful, submit the form
                event.target.submit();
            }
        });
    </script>

</body>
</html>
