<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Users</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Basic Styling for Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url(https://www.touristsecrets.com/wp-content/uploads/2023/09/is-the-life-of-a-traveler-bound-to-be-a-lonely-one-1695376880.jpg);
            background-size: cover;
        }

        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }

        /* Table Styling */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: #fff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Search Bar Styling */
        .search-bar {
            margin: 20px;
            text-align: center;
        }

        .search-bar input {
            padding: 10px;
            width: 200px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .update-btn {
            background-color: #28a745;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .update-btn:hover, .delete-btn:hover {
            opacity: 0.8;
        }

    </style>
</head>
<body>
    <h1>View Users</h1>

    <!-- Search Bar -->
    <div class="search-bar">
        <input type="text" id="searchInput" placeholder="Search by Username, Email, or Phone" onkeyup="filterUsers()">
    </div>

    <!-- Users Table -->
    <table id="usersTable">
        <thead>
            <tr>
                <th>UserID</th>
                <th>Username</th>
                <th>Email</th>
                <th>Phone Number</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for user in users %}
            <tr>
                <td>{{ user[0] }}</td>
                <td>{{ user[1] }}</td>
                <td>{{ user[3] }}</td>
                <td>{{ user[4] }}</td>
                <td>
                    <!-- Update and Delete buttons -->
                    <a href="{{ url_for('update_user', user_id=user[0]) }}">
                        <button class="action-btn update-btn">Update</button>
                    </a>
                    <a href="{{ url_for('delete_user', user_id=user[0]) }}" onclick="return confirm('Are you sure you want to delete this user?')">
                        <button class="action-btn delete-btn">Delete</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>

    <script>
        // Function to filter users based on search input
        function filterUsers() {
            let input = document.getElementById('searchInput').value.toLowerCase();
            let table = document.getElementById('usersTable');
            let rows = table.getElementsByTagName('tr');

            for (let i = 1; i < rows.length; i++) {  // Start from 1 to skip the header row
                let cells = rows[i].getElementsByTagName('td');
                let found = false;

                // Check if any of the cells contain the search query
                for (let j = 0; j < cells.length - 1; j++) { // Skip the Actions column
                    if (cells[j].textContent.toLowerCase().includes(input)) {
                        found = true;
                        break;
                    }
                }

                if (found) {
                    rows[i].style.display = '';
                } else {
                    rows[i].style.display = 'none';
                }
            }
        }
    </script>

</body>
</html>
