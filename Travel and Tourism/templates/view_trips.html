<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Trips</title>
    <style>
        /* Basic Styling for Body */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #333;
            margin: 0;
            padding: 0;
            text-align: center;
            background-image: url(https://www.touristsecrets.com/wp-content/uploads/2023/09/is-the-life-of-a-traveler-bound-to-be-a-lonely-one-1695376880.jpg);
            background-size: cover;
        }

        h1 {
            color: #ffcc00;
            margin-top: 20px;
        }

        /* Table Styling */
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background-color: #fff;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }

        th, td {
            padding: 12px;
            text-align: center;
            border: 1px solid #ddd;
        }

        th {
            background-color: #007bff;
            color: #fff;
        }

        tr:hover {
            background-color: #f1f1f1;
        }

        /* Action Buttons */
        .action-btn {
            padding: 8px 12px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
        }

        .update-btn {
            background-color: #28a745;
        }

        .delete-btn {
            background-color: #dc3545;
        }

        .update-btn:hover, .delete-btn:hover {
            opacity: 0.8;
        }

        /* Back to Home Link */
        a {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
            font-size: 16px;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Trips</h1>

    <!-- Trips Table -->
    <table id="tripsTable">
        <thead>
            <tr>
                <th>Trip ID</th>
                <th>Destination ID</th>
                <th>Destination</th>
                <th>User ID</th>
                <th>Start Date</th>
                <th>End Date</th>
                <th>Max Participants</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for trip in trips %}
            <tr>
                <td>{{ trip[0] }}</td>
                <td>{{ trip[1] }}</td>
                <td>{{ trip[2] }}</td>
                <td>{{ trip[3] }}</td>
                <td>{{ trip[4] }}</td>
                <td>{{ trip[5] }}</td>
                <td>{{ trip[6] }}</td>
                <td>
                    <!-- Update and Delete buttons -->
                    <a href="{{ url_for('delete_trip', trip_id=trip[0]) }}" onclick="return confirm('Are you sure you want to delete this trip?')">
                        <button class="action-btn delete-btn">Delete</button>
                    </a>
                    <a href="{{ url_for('update_trip', trip_id=trip[0]) }}">
                        <button class="action-btn update-btn">Update</button>
                    </a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
